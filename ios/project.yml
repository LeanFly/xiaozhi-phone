name: Xiaozhi
options:
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
packages:
  sherpa-onnx:
    url: https://github.com/k2-fsa/sherpa-onnx.git
    exactVersion: 2.0.1
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Xiaozhi:
    type: application
    platform: iOS
    dependencies:
      - package: sherpa-onnx
        product: sherpa-onnx
    sources:
      - path: Xiaozhi
        excludes:
          - Info.plist
      - path: Models/kws
        type: folder
        buildPhase: resources
      - path: Models/sense
        type: folder
        buildPhase: resources
    info:
      path: Xiaozhi/Info.plist
      properties:
        NSMicrophoneUsageDescription: "使用麦克风进行本地语音对话。"
        NSLocalNetworkUsageDescription: "连接局域网内用户配置的模型服务。"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaozhi.ios
        PRODUCT_NAME: Xiaozhi
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: Xiaozhi
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "使用麦克风进行语音对话。"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "使用语音识别将语音转换为文本。"
        TARGETED_DEVICE_FAMILY: "1,2"
        ARCHS: arm64
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    scheme:
      build:
        targets:
          Xiaozhi: all
