name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

jobs:
  unsigned-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Download and verify local speech model
        run: |
          set -euo pipefail
          mkdir -p ios/Models/sense ios/Models/kws
          base=https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main
          curl -fL --retry 3 "$base/model.int8.onnx" -o ios/Models/sense/model.int8.onnx
          echo 'c71f0ce00bec95b07744e116345e33d8cbbe08cef896382cf907bf4b51a2cd51  ios/Models/sense/model.int8.onnx' | shasum -a 256 -c -
          curl -fL --retry 3 "$base/tokens.txt" -o ios/Models/sense/tokens.txt
          cp app/src/main/assets/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01/* ios/Models/kws/
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build unsigned iOS arm64 app
        run: |
          set -euo pipefail
          xcodebuild -project ios/Xiaozhi.xcodeproj -scheme Xiaozhi \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/xiaozhi-derived" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/xiaozhi-derived/Build/Products/Release-iphoneos/Xiaozhi.app"
          test -d "$app"
          test -s "$app/sense/model.int8.onnx"
          test -s "$app/sense/tokens.txt"
          test -s "$app/kws/keywords.txt"
          mkdir -p "$RUNNER_TEMP/unsigned-ipa/Payload"
          ditto "$app" "$RUNNER_TEMP/unsigned-ipa/Payload/Xiaozhi.app"
          cd "$RUNNER_TEMP/unsigned-ipa"
          zip -qry "$GITHUB_WORKSPACE/Xiaozhi-unsigned.ipa" Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Xiaozhi-unsigned-ipa
          path: Xiaozhi-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
