name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

jobs:
  unsigned-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build unsigned iOS arm64 app
        run: |
          set -euo pipefail
          xcodebuild -project ios/Xiaozhi.xcodeproj -scheme Xiaozhi \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/xiaozhi-derived" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/xiaozhi-derived/Build/Products/Release-iphoneos/Xiaozhi.app"
          test -d "$app"
          mkdir -p "$RUNNER_TEMP/unsigned-ipa/Payload"
          ditto "$app" "$RUNNER_TEMP/unsigned-ipa/Payload/Xiaozhi.app"
          cd "$RUNNER_TEMP/unsigned-ipa"
          zip -qry "$GITHUB_WORKSPACE/Xiaozhi-unsigned.ipa" Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Xiaozhi-unsigned-ipa
          path: Xiaozhi-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
